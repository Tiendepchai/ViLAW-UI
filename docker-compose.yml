services:
  ui-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - apps/server/.env
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data

  ui-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:8787
        VITE_STORAGE_MODE: server
        VITE_TOP_K: 8
    ports:
      - "5173:80"
    depends_on:
      - ui-server
